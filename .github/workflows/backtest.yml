name: Validar backtest (sin desplegar ni modificar señales)

on:
  pull_request:
    paths:
      - "scripts/backtest.py"
      - "scripts/actualizar.py"
      - "tests/**"
      - ".github/workflows/backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests completos offline
        run: python -m unittest discover -s tests -v
  datos-reales:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest exploratorio con datos de mercado
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/backtest.py --years 5 --tickers AMZN,NVDA,MSFT,META,GOOGL,JPM,TGT,COPX,IREN,TQQQ --fee-bps 5 --slippage-bps 10
          else
            python scripts/backtest.py --years 10 --fee-bps 5 --slippage-bps 10
          fi
      - name: Guardar resultados (sin commit, sin publicar en Pages)
        uses: actions/upload-artifact@v4
        with:
          name: backtest-base-resultado
          path: backtest-out/
          retention-days: 30
