name: Validar backtest (sin desplegar ni modificar señales)

on:
  pull_request:
    paths:
      - "scripts/backtest.py"
      - "scripts/radar_features.py"
      - "scripts/earnings.py"
      - "scripts/comparar_macro.py"
      - "scripts/actualizar.py"
      - "tests/**"
      - ".github/workflows/backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests completos offline
        run: python -m unittest discover -s tests -v
  datos-reales:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Comparar baseline y macro prudente sobre misma muestra real
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            YEARS=5
          else
            YEARS=10
          fi
          python scripts/backtest.py --years "$YEARS" --variant baseline --data-cache backtest-out/market --out backtest-out/base --fee-bps 5 --slippage-bps 10
          python scripts/backtest.py --years "$YEARS" --variant prudente --data-cache backtest-out/market --out backtest-out/prudente --fee-bps 5 --slippage-bps 10
          python scripts/comparar_macro.py
          echo "### A/B: Score O >=70 vs habilitar precautoria >=75" >> "$GITHUB_STEP_SUMMARY"
          python scripts/backtest.py --years "$YEARS" --variant floor70 --data-cache backtest-out/market --out backtest-out/floor70 --fee-bps 5 --slippage-bps 10
          python scripts/backtest.py --years "$YEARS" --variant score75 --data-cache backtest-out/market --out backtest-out/score75 --fee-bps 5 --slippage-bps 10
          python scripts/comparar_macro.py --base backtest-out/floor70/resumen.json --prudente backtest-out/score75/resumen.json --out backtest-out/comparacion-score75.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Guardar resultados (sin commit, sin publicar en Pages)
        uses: actions/upload-artifact@v4
        with:
          name: backtest-base-resultado
          path: |
            backtest-out/base/
            backtest-out/prudente/
            backtest-out/floor70/
            backtest-out/score75/
            backtest-out/comparacion.json
            backtest-out/comparacion-score75.json
            backtest-out/market/manifest.json
          retention-days: 30
