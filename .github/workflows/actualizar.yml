name: Actualizar radar CEDEARs

on:
  workflow_dispatch:
  # Fallback automático: el deploy legacy de Pages puede pisar la web del radar.
  # Después de ese deploy, reconstruimos y publicamos docs/ otra vez.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "config/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/actualizar.yml"
  schedule:
    - cron: "0 13 * * *"
      timezone: "America/Argentina/Buenos_Aires"
    - cron: "5 18 * * *"
      timezone: "America/Argentina/Buenos_Aires"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-radar
  cancel-in-progress: false

jobs:
  actualizar-y-publicar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_primary.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Validar configuracion
        run: python scripts/actualizar.py --check
      - name: Tests del motor sin conexión
        run: python -m unittest discover -s tests -v
      - name: Descargar mercado USD, actualizar señales y cartera simulada
        run: python scripts/actualizar.py
        env:
          GH_ACTIONS_TOKEN: ${{ github.token }}
      - name: Guardar historial simulado entre corridas (sin commits)
        uses: actions/upload-artifact@v4
        with:
          name: radar-paper-ledger-v1
          path: .paper/ledger.json
          retention-days: 90
          if-no-files-found: error
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio como artefacto
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      # GitHub Pages puede tardar segundos en indexar un artifact recién subido.
      # Reintentamos dentro del MISMO run, sin duplicar artifacts en un workflow re-run.
      - name: Esperar indexación del artefacto Pages
        run: sleep 20
      - name: Publicar sitio (primer intento)
        id: deploy_primary
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Esperar antes del reintento si falla metadata de Pages
        if: steps.deploy_primary.outcome == 'failure'
        run: sleep 30
      - name: Publicar sitio (reintento)
        id: deploy
        if: steps.deploy_primary.outcome == 'failure'
        uses: actions/deploy-pages@v4
