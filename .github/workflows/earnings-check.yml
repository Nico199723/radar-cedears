name: Verificar calendario de balances (sin desplegar)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/earnings_calendar.py'
      - 'scripts/check_earnings_calendar.py'
      - 'scripts/actualizar.py'
      - 'tests/test_earnings*.py'
      - '.github/workflows/earnings-check.yml'
permissions:
  contents: read
jobs:
  calendario:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check docs/app.js
      - uses: actions/cache@v4
        with:
          path: .cache/earnings.json
          key: earnings-check-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            earnings-check-v1-
      - name: Consultar universo y registrar fuentes
        run: |
          mkdir -p backtest-out
          python -u scripts/check_earnings_calendar.py 2>&1 | tee backtest-out/earnings-check.log
      - name: Publicar cobertura en resumen
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open('backtest-out/earnings-check.json'))
          print('## Calendario de balances\n\n| Métrica | Cantidad |\n|---|---:|')
          for k,v in r['coverage'].items(): print(f'| {k} | {v} |')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earnings-calendar-verification
          path: backtest-out/earnings-check.*
          retention-days: 30
