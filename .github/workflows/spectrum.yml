name: A/B espectral v3 (sin despliegue)
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'docs/app.js'
      - 'docs/style.css'
      - '.github/workflows/spectrum.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check docs/app.js
      - name: A/B mismo histórico, t+1 y costos
        run: python -u scripts/backtest_spectrum.py --cache backtest-out/market --out backtest-out/spectrum
      - name: Sensibilidad IS/OOS sin promoción
        run: python scripts/calibrate_spectrum.py --cache backtest-out/market --out backtest-out/spectrum
      - name: Tabla de resultados
        run: cat backtest-out/spectrum/comparacion.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectrum-ab-v3
          path: backtest-out/
          retention-days: 30
