name: Revisar cambios de interfaz (sin descargar cotizaciones)

on:
  pull_request:
    paths:
      - "docs/**"
      - "tests/**"
      - ".github/workflows/ui-tests.yml"

permissions:
  contents: read

jobs:
  interfaz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verificar sintaxis del JavaScript
        run: node --check docs/app.js
      - name: Ejecutar todas las pruebas offline
        run: python -m unittest discover -s tests -v
